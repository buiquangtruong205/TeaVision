project:
  name: tea-disease-project
  seed: 42

paths:
  raw_data: data/dataset
  processed_data: data/processed
  splits: data/splits
  models: models
  reports: reports
  logs: logs

data:
  image_size: 224
  batch_size: 32
  num_workers: 4
  val_size: 0.15
  test_size: 0.15

preprocessing:
  normalize: true
  min_size: 32
  blur_threshold: 80.0
  dark_threshold: 40.0
  bright_threshold: 220.0
  contrast_threshold: 25.0

augmentation:
  horizontal_flip: true
  random_rotate: 10
  color_jitter: true

training:
  model_name: efficientnet_b0
  num_epochs: 20
  learning_rate: 0.0003
  weight_decay: 0.0001
  early_stopping_patience: 5

mlflow:
  tracking_uri: experiments/mlruns
  experiment_name: tea-disease-classification
